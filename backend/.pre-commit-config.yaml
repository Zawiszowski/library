default_language_version:
  python: python3.12

default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format'
        language: system
        types: ["python"]

      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check --fix'
        language: system
        types: ["python"]
    
    